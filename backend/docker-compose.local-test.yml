# MIHAS — ISOLATED local test stack (throwaway, never touches prod/Neon).
#
# Key isolation properties:
#   - Loads ONLY .env.local.test (local DB/Redis, fake integrations) — it does
#     NOT read backend/.env, so the Neon DATABASE_URL can never leak in.
#   - Its own project name + named volume (postgres-localtest-data) so it is
#     fully separate from the default `docker compose` stack and can be wiped
#     freely without affecting anything else.
#   - Postgres/Redis bound to localhost only.
#
# Usage (from backend/, ALWAYS pass -p and this file):
#   docker compose -p mihas-localtest -f docker-compose.local-test.yml --env-file .env.local.test up -d --build
#   docker compose -p mihas-localtest -f docker-compose.local-test.yml down -v   # wipe everything
#
# See LOCAL-TESTING.md for the full runbook.

services:
  postgres:
    image: postgres:16-alpine
    # localhost-only; port 5433 to avoid clashing with any other local Postgres.
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: mihas_localtest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-localtest-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mihas_localtest"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Private S3-compatible object storage (R1-a). Fixed, fictional local
  # credentials bound to 127.0.0.1 only, like harness/harness.env.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: localtest-minio
      MINIO_ROOT_PASSWORD: localtest-minio-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-localtest-data:/data
    healthcheck:
      # bash TCP probe: needs no curl/wget, which minimal MinIO images may omit.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r line <&3 && [[ $$line == *' 200 '* ]]"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket and applies NO anonymous policy: objects stay private.
  minio-setup:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      until mc alias set local http://minio:9000 localtest-minio localtest-minio-secret; do echo 'waiting for minio'; sleep 1; done;
      mc mb -p local/mihas-localtest;
      echo 'minio bucket ready';
      "
    restart: "no"

  web:
    build:
      context: .
    ports:
      - "127.0.0.1:8000:8000"
    # ONLY the isolated env file — no backend/.env, no Neon.
    env_file:
      - .env.local.test
    # Takes precedence over env_file: storage always points at the MinIO above.
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET: mihas-localtest
      S3_ACCESS_KEY: localtest-minio
      S3_SECRET_KEY: localtest-minio-secret
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully

  celery:
    build:
      context: .
    env_file:
      - .env.local.test
    # Takes precedence over env_file: storage always points at the MinIO above.
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET: mihas-localtest
      S3_ACCESS_KEY: localtest-minio
      S3_SECRET_KEY: localtest-minio-secret
    command: celery -A config worker -l info --concurrency=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully

volumes:
  postgres-localtest-data:
  minio-localtest-data:
