          type: array
          items:
            type: string
        max_size_bytes:
          type: integer
        constraints_source:
          type: string
        constraints_narrowed:
          type: boolean
        state:
          enum:
          - missing
          - uploaded
          - verified
          type: string
          description: |-
            * `missing` - missing
            * `uploaded` - uploaded
            * `verified` - verified
          x-spec-enum-id: 2b3558383b627b41
        document:
          type: object
          additionalProperties: {}
          nullable: true
      required:
      - accepted_extensions
      - accepted_mime_types
      - accepts_document_types
      - constraints_narrowed
      - constraints_source
      - description
      - document
      - document_type
      - label
      - max_size_bytes
      - required
      - source
      - state
