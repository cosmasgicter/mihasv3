          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error. Logged to GlitchTip.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
