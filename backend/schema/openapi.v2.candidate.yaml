      type: object
      description: |-
        Request body for ``POST /api/v1/payments/<uuid>/correct/``.

        The serializer enforces the reason-length guard at the boundary so a
        short reason never reaches the service layer. Field-level errors are
        mapped to stable codes (``OVERRIDE_REASON_REQUIRED`` /
        ``VALIDATION_ERROR``) by the view on validation failure.
      properties:
        target_status:
          enum:
          - pending
          - deferred
          - successful
          - failed
          - expired
          - force_approved
          type: string
          description: |-
            * `pending` - pending
            * `deferred` - deferred
            * `successful` - successful
            * `failed` - failed
            * `expired` - expired
            * `force_approved` - force_approved
          x-spec-enum-id: 777242c2fa5814f3
        reason:
          type: string
          maxLength: 500
          minLength: 10
      required:
      - reason
      - target_status
