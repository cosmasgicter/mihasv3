  /api/v1/payments/settlements/:
    get:
      operationId: payments_settlement_summary
      description: |-
        GET /api/v1/payments/settlements/ — scoped, paginated settlement report.

        Admissions V2 task 8.4 (findings **ADM-06**, **AUTH-02**; R3, R6.5,
        R8.3-R8.4, R12.5-R12.7; design §10.2 "settlement queries filter institution
        in SQL and expose backend aggregates, never a client-filtered global list").

        What changed and why:

        * **Authority** is now a capability, not a role. The gate is
          ``tenant.payment.read`` resolved through ``AdminCapabilityService`` (via
          ``HasTenantCapability`` → ``authorize_tenant_surface``), so a scoped
          Reviewer who legitimately reads their school's payments is admitted — the
          old ``IsAdmin`` role gate denied them — while an actor with no tenant
          scope gets a masked 404 rather than an empty-but-confirming 200.
        * **Filtering is server-side.** ``institution_id``, ``program_offering_id``,
          currency, status, reconciliation bucket, date range, and search all run in
          SQL. Identifier filters are resolved through
          ``visible_institution_queryset`` *before* they reach a query, so an
          out-of-scope id is a masked 404 + ``scope.denied`` Audit_Event.
        * **Pagination and aggregates are the server's.** The response carries the
          canonical ``page`` / ``pageSize`` / ``totalCount`` / ``results`` shape plus
          ``aggregates`` computed over the **whole filtered set**, so a total can
          never be a sum of one loaded page (the ADM-06 defect).
        * **Reconciliation state** is derived from the one payment state machine plus
          the reconciliation sweep's own 24-hour cutoff — no new column, no second
          vocabulary.
        * **Export** (``?export=csv``) is page-independent, requires the explicit
          ``tenant.application.export`` capability, is redacted by capability, is
          bounded by ``EXPORT_ROW_LIMIT``, and emits a ``settlement.exported``
          Audit_Event.
      parameters:
      - in: query
        name: currency
        schema:
          type: string
      - in: query
        name: end_date
        schema:
          type: string
          format: date
      - in: query
        name: export
        schema:
          type: string
        description: Pass 'csv' to download the whole filtered set (page-independent)
          as a CSV file. Requires tenant.application.export.
      - in: query
        name: institution_id
        schema:
          type: string
          format: uuid
        description: Restrict to one in-scope institution. An out-of-scope or unknown
          id returns 404.
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: pageSize
        schema:
          type: integer
      - in: query
        name: program_offering_id
        schema:
          type: string
          format: uuid
        description: Restrict to one in-scope program offering. Out-of-scope → 404.
      - in: query
        name: reconciliation
        schema:
          type: string
        description: One of settled, in_flight, stale, failed, expired, deferred.
      - in: query
        name: search
        schema:
          type: string
        description: Match the settlement snapshot institution/offering label.
      - in: query
        name: start_date
        schema:
          type: string
          format: date
      - in: query
        name: status
        schema:
          type: string
        description: Comma-separated payment statuses. Defaults to every status, so
          reconciliation counts are complete.
      tags:
      - payments
      security:
      - jwtBearerAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          description: Settlement rows grouped by institution, offering, and currency
            with server aggregates and reconciliation state (JSON, or CSV download
            when export=csv).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          description: Authentication required — missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error. Logged to GlitchTip.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get payments settlement summary
