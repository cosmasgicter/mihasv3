              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get admin capabilities
  /api/v1/admin/dashboard/:
    get:
      operationId: api_v1_admin_dashboard_retrieve
      description: |-
        GET /api/v1/admin/dashboard/ — the truthful admin dashboard (task 9.2).

        Requirements **R8.6** / **R17.3-R17.6**; findings **ADM-02** (missing metrics
        synthesized as healthy zeros, scoped polling losing institution scope,
        enabled accounts labelled online users) and **MAINT-02** (misleading labels).

        Every number is computed by :class:`~apps.accounts.dashboard_metrics.DashboardMetricsService`
        over the roster's own scoped queryset, carries the sentence stating what it
        counts, and is either ``ok`` with an integer or ``unknown`` with ``None``.
        There is no zero-valued fallback and no default health grade: the three
        counters this view used to omit entirely (overdue reviews, condition and
        enrollment deadline pressure) are real counters now, and a source that fails
        marks its own metrics unknown instead of returning reassuring zeros.

        The legacy ``applications`` / ``users`` / ``needs_attention`` blocks are kept
        for existing consumers, but a key whose source failed is **omitted** rather
        than written as ``0`` — an absent key is a question the payload declines to
        answer, where a zero is a wrong answer.

        ``?institution_id=`` narrows the dashboard to one school. It is resolved
        through the roster's scope-before-lookup resolver, so an out-of-scope or
        unknown id is the same masked 404 the roster returns rather than a 200 whose
        zeros would confirm the id resolves.
      tags:
      - admin
      security:
      - jwtBearerAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboard'
          description: ''
        '401':
          description: Authentication required — missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — the authenticated user lacks permission for this
            action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error. Logged to GlitchTip.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Retrieve api v1 admin dashboard
  /api/v1/admin/fees/:
    get:
      operationId: admin_fees_list
      description: |-
        GET /api/v1/admin/fees/ — the scoped fee-administration report.

        Authority is the per-institution ``tenant.program.read`` capability resolved
        through ``AdminCapabilityService``; an actor with no tenant scope receives a
        masked 404 rather than an empty page. Writes are **not** here: fee mutation
        stays on the canonical ``/api/v1/programs/{id}/fees/`` path, which task 8.4
        gates on ``platform.program_assignment.manage``.
      parameters:
      - in: query
        name: currency
        schema:
          type: string
      - in: query
        name: export
        schema:
          type: string
        description: Pass 'csv' to download the whole filtered set (page-independent).
          Requires tenant.application.export.
      - in: query
        name: fee_type
        schema:
          type: string
        description: application | tuition
      - in: query
        name: institution_id
        schema:
          type: string
          format: uuid
        description: Restrict to one in-scope institution. Out-of-scope or unknown
          → 404.
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: pageSize
        schema:
          type: integer
      - in: query
        name: program_offering_id
        schema:
          type: string
          format: uuid
        description: Restrict to one in-scope offering. Out-of-scope or unknown →
          404.
      - in: query
        name: residency_category
        schema:
          type: string
        description: local | international
      - in: query
        name: search
        schema:
          type: string
        description: Match institution name, offering name, or offering code.
      tags:
      - admin
      security:
      - jwtBearerAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          description: Scoped fee schedules with server aggregates and coverage (JSON,
            or CSV download when export=csv).
        '403':
          content:
            application/json:
