    get:
      operationId: v2_student_application_readiness
      description: 'Returns the authoritative, deterministic readiness report for
        one application: assignment/configuration version, profile and identity blockers,
        persisted canonical grade count and eligibility results, versioned required-document
        states, fee/payment/defer state, capacity/duplicate/late checks, declarations,
        and the allowed next actions. Client validation never declares an application
        submittable on its own — submission re-runs these gates under row locks.'
      summary: Authoritative application readiness
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        description: Application UUID.
        required: true
      - in: query
        name: declarations_accepted
        schema:
          type: boolean
        description: Report the declaration as accepted. Affects the declaration section
          and blocker only; the submit command always re-checks the declaration under
          the row lock.
      tags:
      - applications
      security:
      - jwtBearerAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationReadinessResponse'
          description: ''
        '401':
          description: Authentication required.
        '404':
          description: Not found (also masks out-of-scope access).
        '503':
          description: CONFIGURATION_UNAVAILABLE — canonical configuration could not
            be evaluated (retryable).
        '403':
          description: Forbidden — the authenticated user lacks permission for this
            action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error. Logged to GlitchTip.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health/live/:
    get:
      operationId: health_liveness
      description: Liveness probe - returns HTTP 200 with no external dependencies.
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
          description: Liveness probe response.
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error. Logged to GlitchTip.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get health liveness
  /health/ready/:
    get:
      operationId: health_readiness
      description: Readiness probe - verifies Neon Postgres and Redis connectivity.
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
          description: All backend dependencies are healthy.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
          description: One or more backend dependencies are unavailable.
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error. Logged to GlitchTip.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get health readiness
  /health/redis/:
    get:
      operationId: health_redis
      description: Redis-only probe for dedicated monitoring without changing readiness.
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
          description: Redis is reachable.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
          description: Redis is unavailable.
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error. Logged to GlitchTip.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get health redis
