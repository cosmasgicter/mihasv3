  /api/v1/admin/institutions/{institution_id}/audit/:
    get:
      operationId: admin_institution_audit_list
      description: |-
        GET /api/v1/admin/institutions/<id>/audit/ — the one tenant audit feed.

        The **selected institution** endpoint R6.6 requires: scoped, capability-gated,
        filtered and paginated in SQL, with server-computed facets and a
        page-independent audited CSV export. All of it is delegated to
        :class:`~apps.catalog.tenant_audit_query_service.TenantAuditQueryService`; this
        view resolves the actor's access, asks the service, and answers.

        Authority (task 9.5, finding **ADM-05**): the institution id is resolved
        through ``visible_institution_queryset`` **before** any audit query, so an
        out-of-scope, unknown or malformed id is one indistinguishable masked 404;
        then ``tenant.audit.read`` is required *for that institution* through
        ``AdminCapabilityService`` (a Super_Admin passes on platform authority). The
        previous ``IsAdmin`` role class plus inline scope-id set is gone: no role
        string is compared on this surface.

        Requirements: R3, R6.6, R13.5.
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: Exact action match.
      - in: query
        name: actor_id
        schema:
          type: string
          format: uuid
      - in: query
        name: category
        schema:
          type: string
        description: configuration | authorization | review | document | payment |
          export | communication | other
      - in: query
        name: date_from
        schema:
          type: string
          format: date-time
      - in: query
        name: date_to
        schema:
          type: string
          format: date-time
      - in: query
        name: entity_type
        schema:
          type: string
      - in: query
        name: export
        schema:
          type: string
        description: Pass 'csv' to download the whole filtered set (page-independent).
          Requires tenant.application.export.
      - in: path
        name: institution_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: pageSize
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Match action or entity type.
      tags:
      - admin
      security:
      - jwtBearerAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          description: This school's audit events with server facets (JSON, or a CSV
            download when export=csv).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          description: Authentication required — missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error. Logged to GlitchTip.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: List admin institution audit
