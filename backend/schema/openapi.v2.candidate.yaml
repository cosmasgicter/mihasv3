  /api/v1/admin/applications/:
    get:
      operationId: admin_applications_query
      description: |-
        GET /api/v1/admin/applications/ — the one scoped applications query.

        Read authority is the per-institution ``tenant.application.read`` capability
        resolved through ``AdminCapabilityService``; a caller with no tenant scope
        receives a masked 404 rather than a confirming empty page. Writes are **not**
        here — every application command keeps its own canonical route and its own
        capability.
      parameters:
      - in: query
        name: assigned_reviewer_id
        schema:
          type: string
          format: uuid
        description: Restrict to one reviewer with assigned work in scope. Out-of-scope
          or unknown → masked 404.
      - in: query
        name: deadline_pressure
        schema:
          type: boolean
        description: An open condition or enrollment confirmation falls due inside
          the deadline window.
      - in: query
        name: end_date
        schema:
          type: string
          format: date
      - in: query
        name: exclude_status
        schema:
          type: string
        description: Comma-separated statuses to exclude (e.g. 'draft').
      - in: query
        name: export
        schema:
          type: string
        description: Pass 'csv' to download the whole filtered set (page-independent).
          Requires tenant.application.export.
      - in: query
        name: has_pending_amendments
        schema:
          type: boolean
      - in: query
        name: has_pending_documents
        schema:
          type: boolean
      - in: query
        name: has_upcoming_interviews
        schema:
          type: boolean
      - in: query
        name: institution
        schema:
          type: string
        description: Match the resolved institution label.
      - in: query
        name: institution_id
        schema:
          type: string
          format: uuid
        description: Restrict to one in-scope institution. Out-of-scope or unknown
          → masked 404.
      - in: query
        name: intake
        schema:
          type: string
        description: Match the resolved intake label.
      - in: query
        name: intake_id
        schema:
          type: string
          format: uuid
        description: Restrict to one in-scope intake. Out-of-scope or unknown → masked
          404.
      - in: query
        name: is_late_submission
        schema:
          type: boolean
      - in: query
        name: order
        schema:
          type: string
        description: asc | desc
      - in: query
        name: overdue_review
        schema:
          type: boolean
        description: Past the configured review SLA.
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: pageSize
        schema:
          type: integer
      - in: query
        name: payment_status
        schema:
          type: string
        description: Comma-separated payment statuses.
      - in: query
        name: program
        schema:
          type: string
        description: Match the resolved offering/program label.
      - in: query
        name: program_offering_id
        schema:
          type: string
          format: uuid
        description: Restrict to one in-scope offering. Out-of-scope or unknown →
          masked 404.
      - in: query
        name: review_queue
        schema:
          type: boolean
        description: Submitted or under review.
      - in: query
        name: reviewer_assignment
        schema:
          type: string
        description: assigned | unassigned
      - in: query
        name: saved_filter
        schema:
          type: string
          format: uuid
        description: Apply one of the caller's own saved filters as the base query.
          Explicit query parameters win.
      - in: query
        name: search
        schema:
          type: string
        description: Match applicant name, email, application number, or tracking
          code.
      - in: query
        name: sort
        schema:
          type: string
        description: activity_at | created_at | submitted_at | full_name | status
          | payment_status | program | institution | deadline
      - in: query
        name: start_date
        schema:
          type: string
          format: date
      - in: query
        name: status
        schema:
          type: string
        description: Comma-separated application statuses.
      tags:
      - admin
      security:
      - jwtBearerAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          description: Scoped applications with server facets, whole-set aggregates,
            and deadline state (JSON, or CSV download when export=csv).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          description: Authentication required — missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error. Logged to GlitchTip.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get admin applications query
  /api/v1/admin/applications/{application_id}/:
    get:
      operationId: admin_application_review_workspace
      description: 'The whole admin review workspace for one application in a single
        read: canonical identity, submitted answers, canonical assignment, evidence
        (current document versions and persisted grades), the canonical payment ledger,
        interviews, offer conditions, amendment requests, communication, status history,
        and the **deterministic** reviewer readiness checklist. No generative model
        is involved. ``readiness`` is null — never a zeroed checklist — when the canonical
        configuration could not be evaluated. ``version`` is the value every workspace
        command must carry; a command supplying an older version is refused with VERSION_CONFLICT
        (409).'
      summary: One structured application detail + readiness query
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        description: Application UUID. Out-of-scope, unassigned-for-a-Reviewer, and
          unknown ids are one indistinguishable 404.
        required: true
      tags:
      - admin
      security:
      - jwtBearerAuth: []
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewWorkspaceResponse'
          description: ''
        '401':
          content:
            application/json:
