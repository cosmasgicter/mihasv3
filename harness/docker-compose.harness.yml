# Admissions V2 — isolated local E2E harness (design section 16 / R18.1).
#
# Fully local, disposable, seeded fresh each run. NEVER points at Neon,
# Cloudflare R2, Zoho, Resend, or the real Lenco gateway. This file is separate
# from deploy/docker-compose.prod.yml and never mutates it.
#
# Topology:
#   postgres  redis  minio(+minio-setup)  mailpit        (isolated infra)
#   adapters  (deterministic payment + domain + ops observer)
#   web  worker  beat                                    (Django + Celery)
#   caddy     (serves the built SPA + same-origin /api proxy, Host preserved)
#
# One-command entrypoint: harness/bin/harness up
name: mihas-v2-harness

x-backend: &backend
  build:
    context: ../backend
  env_file:
    - harness.env
  # Journey-gate switches (SJR task 4.1, R9-a). Defaults keep the broad matrix's
  # settings: 900 s links, internal storage endpoint, limiter off.
  environment:
    S3_SIGNED_URL_TTL_SECONDS: ${S3_SIGNED_URL_TTL_SECONDS:-900}
    S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-}
    HARNESS_RATELIMIT_ENABLE: ${HARNESS_RATELIMIT_ENABLE:-0}
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    env_file: [harness.env]
    # tmpfs => the DB is wiped and re-seeded fresh on every `up` (R18.1).
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    # Bitnami image: its own entrypoint starts the server (no `server /data`).
    env_file: [harness.env]
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    tmpfs:
      - /bitnami/minio/data:mode=1777
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r line <&3 && [[ $$line == *' 200 '* ]]"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Create the harness bucket once MinIO is up, then exit.
  minio-setup:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3@sha256:73bd39f7899a0cef12b8dd5df13aa93a3ed1aaa44236542442e9ac76819ac158
    depends_on:
      minio:
        condition: service_started
    env_file: [harness.env]
    environment:
      HARNESS_BUCKET_ANONYMOUS: ${HARNESS_BUCKET_ANONYMOUS:-download}
    entrypoint: >-
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do echo 'waiting for minio'; sleep 1; done;
      mc mb -p local/harness || true;
      mc anonymous set $${HARNESS_BUCKET_ANONYMOUS:-download} local/harness || true;
      echo 'minio bucket ready';
      "
    restart: "no"

  # Console/test email inbox: SMTP sink on 1025 + query API/UI on 8025.
  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:58025:8025"
      - "127.0.0.1:51025:1025"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8025/livez"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Deterministic payment + domain adapters + operational (drain) observer.
  adapters:
    build:
      context: ./adapters
    environment:
      ADAPTER_PORT: "9099"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CELERY_QUEUES: celery
    ports:
      - "127.0.0.1:59099:9099"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    <<: *backend
    # Bootstrap a fresh schema + platform super-admin + subjects, seed the two
    # example tenants, then serve. All steps are idempotent.
    command: >-
      sh -c "python manage.py harness_bootstrap &&
             python manage.py harness_seed_tenants &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --lifespan off --timeout-keep-alive 30"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      adapters:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u,sys; r=u.Request('http://127.0.0.1:8000/health/live/', headers={'Host':'localhost'}); sys.exit(0 if u.urlopen(r,timeout=5).status==200 else 1)"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s

  worker:
    <<: *backend
    command: celery -A config worker -l info --concurrency=2
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    <<: *backend
    command: celery -A config beat -l info
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The admissions SPA build output, produced on the host by `harness build`.
      - ../apps/admissions/dist:/srv/www:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
